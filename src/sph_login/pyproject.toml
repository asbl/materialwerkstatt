[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sph-login"
version = "0.1.0"
description = "Reusable Schulportal Hessen authentication and browser session bridge"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
browser = ["playwright>=1.45,<2"]

[tool.setuptools]
packages = ["sph_login"]
package-dir = {sph_login = "."}
