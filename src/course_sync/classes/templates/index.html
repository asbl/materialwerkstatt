<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kurse</title>
    ${METADATA}
    <style>
      :root {
        color-scheme: light;
        --page: #f7f8fb;
        --surface: #ffffff;
        --ink: #172033;
        --muted: #64748b;
        --border: #d8dee8;
        --warning: #b45309;
        --warning-bg: #fff7ed;
        --warning-border: #fed7aa;
        --shadow: 0 18px 46px rgba(15, 23, 42, 0.1);
        --topbar-height: 61px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--page);
        color: var(--ink);
      }
      a { color: inherit; }
      main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 72px; }
      .site-topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(12px);
      }
      .site-topbar-inner {
        width: min(1120px, calc(100% - 32px));
        min-height: var(--topbar-height);
        margin: 0 auto;
        padding: 12px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .site-brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        color: inherit;
        font-weight: 750;
        text-decoration: none;
      }
      .site-brand:hover,
      .site-brand:focus-visible { color: #2563eb; }
      .site-brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 7px;
        background: #2563eb;
        box-shadow: inset 0 -8px 14px rgba(0, 0, 0, 0.16);
      }
      .site-topbar-link {
        color: var(--muted);
        font-size: 0.95rem;
        font-weight: 750;
        text-decoration: none;
      }
      .site-topbar-link:hover,
      .site-topbar-link:focus-visible {
        color: var(--ink);
        text-decoration: underline;
      }
      .site-header { margin-bottom: 24px; }
      .site-header h1 { margin: 0; font-size: 2.1rem; line-height: 1.12; letter-spacing: 0; }
      .site-header p { max-width: 760px; margin: 10px 0 0; color: var(--muted); font-size: 1rem; line-height: 1.6; }
      .course-tabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 8px 0 12px;
        margin-bottom: 10px;
        scrollbar-width: thin;
      }
      .course-group + .course-group { margin-top: 34px; }
      .course-group-header {
        margin-bottom: 6px;
      }
      .course-group-header h2 {
        margin: 0;
        font-size: 1.2rem;
        line-height: 1.25;
        letter-spacing: 0;
      }
      .course-group-header p {
        max-width: 760px;
        margin: 6px 0 0;
        color: var(--muted);
        line-height: 1.55;
      }
      .course-tab {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        font-size: 0.92rem;
        font-weight: 700;
        cursor: pointer;
      }
      .course-tab[aria-selected="true"] {
        border-color: var(--course-color);
        box-shadow: inset 0 -3px 0 var(--course-color);
      }
      .course-tab.is-preview {
        border-style: dashed;
        color: #7c2d12;
        background: var(--warning-bg);
      }
      .tab-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--course-color);
      }
      .tab-preview-label {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 2px 7px;
        border-radius: 999px;
        background: #ffedd5;
        color: #9a3412;
        font-size: 0.74rem;
        font-weight: 800;
        text-transform: uppercase;
      }
      .course-panel {
        min-height: 270px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 18px;
        padding: 28px;
        border: 1px solid color-mix(in srgb, var(--course-color) 42%, var(--border));
        border-radius: 8px;
        background:
          linear-gradient(90deg, color-mix(in srgb, var(--course-color) 12%, transparent), transparent 62%),
          var(--surface);
        box-shadow: var(--shadow);
      }
      .course-panel.is-preview {
        border-color: var(--warning-border);
        background:
          linear-gradient(90deg, rgba(251, 146, 60, 0.18), transparent 62%),
          repeating-linear-gradient(135deg, rgba(251, 146, 60, 0.09) 0 8px, transparent 8px 18px),
          var(--surface);
      }
      .course-panel[hidden] { display: none; }
      .course-kicker { margin: 0 0 8px; color: var(--course-color); font-size: 0.82rem; font-weight: 800; text-transform: uppercase; }
      .course-panel h2 { max-width: 720px; margin: 0; font-size: 2rem; line-height: 1.15; letter-spacing: 0; }
      .course-panel p { max-width: 680px; margin: 12px 0 0; color: var(--muted); line-height: 1.6; }
      .course-panel .preview-notice {
        color: #7c2d12;
        font-weight: 700;
      }
      .course-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; color: var(--muted); font-weight: 700; font-size: 0.9rem; }
      .course-meta span {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 5px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #fff;
      }
      .course-status.preview { color: #9a3412; border-color: #fdba74 !important; background: #ffedd5 !important; text-transform: uppercase; }
      .course-status.ready { color: #166534; border-color: #9bd5a7 !important; background: #f0fdf4 !important; }
      .course-open {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 9px 15px;
        border-radius: 8px;
        background: var(--course-color);
        color: #fff;
        text-decoration: none;
        font-weight: 800;
        white-space: nowrap;
      }
      .imprint {
        margin-top: 28px;
        padding-top: 22px;
        border-top: 1px solid var(--border);
        color: var(--muted);
      }
      .imprint h2 {
        margin: 0 0 8px;
        color: var(--ink);
        font-size: 1rem;
        letter-spacing: 0;
      }
      .imprint p {
        margin: 4px 0;
        line-height: 1.55;
      }
      .imprint a { color: var(--ink); }
      @media (max-width: 720px) {
        main { width: min(100% - 24px, 1120px); padding-top: 24px; }
        .site-topbar-inner { width: min(100% - 24px, 1120px); }
        .site-header h1, .course-panel h2 { font-size: 1.55rem; }
        .course-panel { grid-template-columns: 1fr; min-height: 0; padding: 20px; }
        .course-open { width: 100%; }
      }
    </style>
  </head>
  <body>
    <header class="site-topbar">
      <div class="site-topbar-inner">
        <a class="site-brand" href="${HOME_HREF}" aria-label="Zur Startseite">
          <span class="site-brand-mark" aria-hidden="true"></span>
          <span>Kurse</span>
        </a>
        <a class="site-topbar-link" href="#impressum-title">Impressum</a>
      </div>
    </header>
    <main>
      <header class="site-header">
        <h1>Kurse</h1>
        ${SITE_DESCRIPTION}
      </header>
      ${COURSE_GROUPS}
      <section class="imprint" aria-labelledby="impressum-title">
        <h2 id="impressum-title">Impressum</h2>
        ${IMPRESSUM}
      </section>
    </main>
    <script>
      document.querySelectorAll(".course-group").forEach((group) => {
        const tabs = [...group.querySelectorAll(".course-tab")];
        const panels = [...group.querySelectorAll(".course-panel")];
        tabs.forEach((tab, index) => {
          tab.addEventListener("click", () => {
            tabs.forEach((item) => item.setAttribute("aria-selected", "false"));
            panels.forEach((panel) => panel.hidden = true);
            tab.setAttribute("aria-selected", "true");
            panels[index].hidden = false;
          });
        });
      });
    </script>
  </body>
</html>
