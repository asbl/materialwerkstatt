config:
  MD013:
    line_length: 120
    code_blocks: false
    tables: false
  MD055: false
  MD056: false
  MD058: false
  aufgabe-punkte: true

customRules:
  - "./src/quarto/lint/aufgabe-punkte.cjs"

globs:
  - "**/*.md"
  - "**/*.qmd"

ignores:
  - ".quarto/**"
  - "quellen-*/**"   # Quellen und Web-Lesekopien sind Material, kein selbst geschriebenes Markdown
  - "audit/**"
  - "build/**"
  - "**/build/**"
  - "**/pdf/**"
